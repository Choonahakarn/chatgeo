# น้ำจากดาวเทียม Sentinel-1 ทั้งประเทศ: แบ่งไทยเป็นกรอบละ 1 องศา (76 กรอบ)
# วันละ 2 รอบ เช็กว่ากรอบไหนมีภาพใหม่ แล้ววิเคราะห์เฉพาะกรอบนั้น
# ผลเก็บใน branch "flood-data" (เก็บ commit เดียว เขียนทับทุกครั้ง repo จะได้ไม่บวม)
# หน้าเว็บอ่านจาก https://raw.githubusercontent.com/<repo>/flood-data/index.json
# กดรันเองได้ที่แท็บ Actions → "น้ำจากดาวเทียม" → Run workflow
name: น้ำจากดาวเทียม

on:
  schedule:
    - cron: '17 2 * * *'    # 09:17 น. เวลาไทย
    - cron: '17 14 * * *'   # 21:17 น. เวลาไทย
  workflow_dispatch:
    inputs:
      tiles:
        description: 'เฉพาะกรอบ เช่น t100_13,t101_13 (เว้นว่าง = ทุกกรอบที่มีภาพใหม่)'
        required: false
        default: ''
      force:
        description: 'วิเคราะห์ใหม่แม้ไม่มีภาพใหม่'
        type: boolean
        default: false
      budget:
        description: 'เวลาสูงสุดที่จะเริ่มกรอบใหม่ (นาที)'
        required: false
        default: '300'
      as_of:
        description: 'วิเคราะห์ย้อนหลัง ณ วันที่ YYYY-MM-DD เก็บไว้เทียบว่าน้ำเพิ่มหรือลด (เว้นว่าง = ปกติ)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: flood
  cancel-in-progress: false

jobs:
  flood:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TILES: ${{ inputs.tiles }}
      FORCE: ${{ inputs.force && '--force' || '' }}
      BUDGET: ${{ inputs.budget || '300' }}
      AS_OF: ${{ inputs.as_of }}
      OUT: /tmp/chatgeo-flood
      DATA: /tmp/flood-data
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-flood.txt

      - name: ดึงผลเดิม (branch flood-data)
        run: |
          git clone -q --depth 1 --branch flood-data "$REMOTE" "$DATA" 2>/dev/null || {
            echo "ยังไม่มี branch flood-data จะสร้างใหม่"
            mkdir -p "$DATA" && git -C "$DATA" init -q -b flood-data
          }

      - name: เช็กว่ากรอบไหนมีภาพใหม่
        id: check
        run: |
          pip install -q pystac-client planetary-computer shapely
          # โหมดย้อนหลังต้องวิเคราะห์ทุกกรอบ (ไม่เทียบกับผลปัจจุบัน)
          python scripts/flood_s1.py --grid-check --data "$DATA" --todo "$OUT/todo.txt" --tiles "$TILES" $FORCE ${AS_OF:+--as-of $AS_OF --force}

      - name: ติดตั้งไลบรารีวิเคราะห์ภาพ
        if: steps.check.outputs.count != '0'
        run: pip install -q -r scripts/requirements-flood.txt

      - name: วิเคราะห์
        if: steps.check.outputs.count != '0'
        run: python scripts/flood_s1.py --grid-run --todo "$OUT/todo.txt" --out "$OUT" --budget "$BUDGET" ${AS_OF:+--as-of $AS_OF}

      - name: รวมผลและสรุปรายจังหวัด
        if: steps.check.outputs.count != '0'
        run: python scripts/add_flood.py --grid "$OUT/tiles" --dest "$DATA" ${AS_OF:+--history-only}

      - name: เก็บลง branch flood-data
        if: steps.check.outputs.count != '0'
        run: |
          cd "$DATA"
          git config user.name "ChatGeo bot"
          git config user.email "chatgeo-bot@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "น้ำจากดาวเทียม $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git push -q -f "$REMOTE" snapshot:flood-data
          echo "เก็บแล้ว: $(ls tiles | wc -l) กรอบ"

      - name: แจ้งถ้ามีกรอบที่พัง
        if: steps.check.outputs.count != '0'
        run: |
          if [ -s "$OUT/errors.txt" ]; then cat "$OUT/errors.txt"; exit 1; fi
