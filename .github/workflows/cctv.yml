# กล้อง CCTV + AI ดูภาพ (ทดลอง): ทุกชั่วโมง ดึงภาพจากกล้องใน data/cctv.json
# ให้ VLM ตัวเล็กดูว่าน้ำท่วม น้ำสูง หรือฝนตกไหม นับรถ (เฉพาะกล้องถนน) แล้วเก็บผลใน branch "cctv-data"
# AI ดูเฉพาะฉาก ไม่จดจำใบหน้า ไม่อ่านทะเบียน ไม่ติดตามคน
# ขั้นแรกดึงตารางลมรายชั่วโมง (wind.json) ไว้ใน branch เดียวกัน สำหรับเส้นลมบนแผนที่
# หน้าเว็บอ่านจาก https://raw.githubusercontent.com/<repo>/cctv-data/index.json
# กดรันเองได้ที่แท็บ Actions → "กล้อง CCTV + AI" → Run workflow
name: กล้อง CCTV + AI

on:
  schedule:
    - cron: '35 * * * *'    # ทุกชั่วโมง นาทีที่ 35 (ภาพเขื่อน กฟผ. อัปเดตราวนาทีที่ 22)
  workflow_dispatch:
    inputs:
      vlm:
        description: 'โมเดลดูภาพ (smolvlm = เร็ว · qwen2vl = บรรยายภาษาไทยได้แต่ช้า · none = ไม่ใช้ AI)'
        type: choice
        options: [smolvlm, qwen2vl, none]
        default: smolvlm
      only:
        description: 'เฉพาะกล้องหรือจุด เช่น hy-bangsala,egat-bb (เว้นว่าง = ทุกกล้อง)'
        required: false
        default: ''
      budget:
        description: 'นาทีสูงสุดที่ให้ AI ดูภาพ (เกินแล้วกล้องที่เหลือรอรอบหน้า)'
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: cctv
  cancel-in-progress: false

jobs:
  cctv:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VLM: ${{ inputs.vlm || 'smolvlm' }}
      ONLY: ${{ inputs.only }}
      BUDGET: ${{ inputs.budget || '30' }}
      DATA: /tmp/cctv-data
      HF_HOME: /home/runner/.cache/huggingface
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-cctv.txt

      - name: เก็บโมเดลไว้ใช้รอบหน้า
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-${{ env.VLM }}-rtdetr-v1

      - name: ดึงผลเดิม (branch cctv-data)
        run: |
          git clone -q --depth 1 --branch cctv-data "$REMOTE" "$DATA" 2>/dev/null || {
            echo "ยังไม่มี branch cctv-data จะสร้างใหม่"
            mkdir -p "$DATA" && git -C "$DATA" init -q -b cctv-data
          }

      - name: ลมรายชั่วโมง (Open-Meteo) สำหรับเส้นลมบนแผนที่
        run: python scripts/wx_grid.py --out "$DATA"

      - name: ติดตั้งไลบรารี
        run: pip install -q -r scripts/requirements-cctv.txt

      - name: ดึงภาพและให้ AI ดู
        run: python scripts/cctv_scan.py --registry data/cctv.json --data "$DATA" --vlm "$VLM" --budget "$BUDGET" --only "$ONLY"

      - name: เก็บลง branch cctv-data
        run: |
          cd "$DATA"
          git config user.name "ChatGeo bot"
          git config user.email "chatgeo-bot@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "กล้อง CCTV $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git push -q -f "$REMOTE" snapshot:cctv-data
